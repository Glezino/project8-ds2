schema: spec-driven

context: |
  ## Technology Stack
  Frontend: React (Vite), TypeScript, Tailwind, Shadcn/ui, Axios, React Router DOM
  Backend: Python, FastAPI, Pydantic, SQLAlchemy, Alembic
  Machine Learning: Polars, Scikit-learn, XGBoost, Optuna, Seaborn, Matplotlib
  Testing: pytest (backend/ML), Playwright (end-to-end)
  Database: Supabase (Postgres) in production, PostgreSQL in Docker for development
  Infrastructure: independent Docker containers per service + Docker Compose for
  local development; Makefile with setup, installation, service startup, and test commands

  ## Architecture
  - Separation of responsibilities by folder: frontend/, backend/, backend/ml/
  - DRY and KISS principles: before creating a new abstraction, component, service, utility,
    dependency, or layer, check whether an existing project pattern already solves the
    problem
  - Mandatory TDD: every new feature must first be specified with a failing test,
    and then implemented with the minimum code required to make it pass

  ## Traceability
  - Each OpenSpec change corresponds to a Jira issue (e.g. DS-10)
  - The Jira issue code must appear in the change name, branch, commits, and PR

  ## Spec Language
  - Describe observable behavior (what the user or system sees or does), not
    implementation details
  - Use Given/When/Then scenarios
  - Implementation details (specific libraries, function names, folder structure) belong
    in design.md, not in specs/

rules:
  proposal:
    - The frontmatter must include "jira: DS-XX" with the actual issue code
    - The scope must correspond to a single Jira issue; if it covers more than one, split
      it into multiple changes
    - Explicitly state which part is affected: frontend, backend, and/or ML

  specs:
    - Scenarios must use Given/When/Then format
    - Before adding a new requirement, review existing specs/ to avoid duplication or
      contradictions
    - Every requirement must be verifiable by an automated test (pytest or Playwright)

  design:
    - Specify which folder(s) contain the change: frontend/, backend/, or backend/ml/
    - Justify any new dependency, abstraction, or layer by explaining why existing project
      patterns do not cover it (DRY/KISS check)
    - Identify any impact on the database schema (Alembic migrations), if applicable
    - Identify whether the change requires environment variables, new Docker services,
      or changes to the Makefile

  tasks:
    - Each functional block must be broken down into: (1) a failing test task,
       (2) an implementation task that makes it pass, (3) a refactoring task if applicable (TDD)
    - Include a final lint + test suite task before considering the change ready to
      commit
    - Each test task must specify whether it uses pytest (backend/ML) or Playwright (e2e)

operations:
  apply:
    guidance:
      - Run new or affected tests in isolation first, then run the full test suite
      - Run the linter before considering a task complete
      - Do not mark a task as completed if its corresponding test is not green
  archive:
    guidance:
      - The archive summary must link the Jira issue (DS-XX) and the PR number
      - Keep the summary brief: what changed and why, not how
